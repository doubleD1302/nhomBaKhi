plugins {
    id "com.android.application"
}

def sharedApiConfigFile = rootProject.file("../client-flutter/lib/api_config.dart")
if (!sharedApiConfigFile.isFile()) {
    throw new GradleException("Shared API config not found: ${sharedApiConfigFile}")
}
def sharedApiConfig = sharedApiConfigFile.getText("UTF-8")
def apiBaseUrlMatcher = sharedApiConfig =~ /const String apiBaseUrl = '([^']+)';/
if (!apiBaseUrlMatcher.find()) {
    throw new GradleException("Could not read apiBaseUrl from ${sharedApiConfigFile}")
}
def apiBaseUrl = apiBaseUrlMatcher.group(1).trim()
if (!(apiBaseUrl.startsWith("http://") || apiBaseUrl.startsWith("https://"))) {
    throw new GradleException("apiBaseUrl must start with http:// or https://")
}
if (!apiBaseUrl.endsWith("/")) {
    apiBaseUrl += "/"
}

android {
    namespace "com.nhomxx.parttime"
    compileSdk 35
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.nhomxx.parttime"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "API_BASE_URL", "\"${apiBaseUrl}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "com.google.android.material:material:1.12.0"
    implementation "com.squareup.retrofit2:retrofit:2.11.0"
    implementation "com.squareup.retrofit2:converter-gson:2.11.0"
}
